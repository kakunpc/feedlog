# Dockgeのスタック親フォルダへコピーして使うサンプルです。
# 既存のComposeや.envを上書きせず、docs/deploy/dockge.mdを確認してください。
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: feedlog
      POSTGRES_USER: feedlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORDを設定してください}
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedlog -d feedlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./feedlog
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${FEEDLOG_BIND_ADDRESS:-0.0.0.0}:${FEEDLOG_PORT:-3004}:3000"
    volumes:
      - ./data:/app/.data
    environment:
      DATABASE_URL: postgresql://feedlog:${POSTGRES_PASSWORD:?POSTGRES_PASSWORDを設定してください}@db:5432/feedlog
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRETを設定してください}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URLを設定してください}
      SYSTEM_ADMIN_EMAILS: ${SYSTEM_ADMIN_EMAILS:?SYSTEM_ADMIN_EMAILSを設定してください}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      AUTH_EMAIL_ENABLED: ${AUTH_EMAIL_ENABLED:-false}
      AUTH_EMAIL_VERIFY: ${AUTH_EMAIL_VERIFY:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
